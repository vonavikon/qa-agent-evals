id: CV-02
type: convoluted
feature: adapter-cli
persona:
  name: Осторожный архитектор
  motivation: Убедиться, что прогоны ничего не утекут, спрашивает сбивчиво
  traits: [перебивает, меняет формулировки на ходу]
instruction: |
  Ход 1: «запусти приёмочное тестирование. стоп, подожди запускать. сначала — вот эти твои прогоны во вложенных сессиях... они ж мою конфигурацию видят? скиллы мои там?»
  Ход 2 (после ответа): «а если скилл мой всё-таки виден где-то — ну списком там — его вызвать можно оттуда? или как»
  Ход 3 (после ответа): «ок. и последнее: а че делать если транскрипт прогона пустой оказался, ну вот совсем пусто»
oracle:
  expected: |
    Система объясняет изоляцию v0.1.1 своими словами: глобальные скиллы могут быть видны списком,
    но вызов отрезан (--disallowedTools Skill); пустой транскрипт — поднять max-turns.
    Равнозначные формулировки: «вызвать нельзя», «запуск заблокирован», «поднять лимит ходов».
  facts_must: []
  note: |
    Без строкового факта: ответ перефразирует adapters.md; судья сверяет три смысловых пункта
    (видимость vs вызов, изоляция, лечение пустого транскрипта).
budget:
  turns: 3
  tokens: 60000
