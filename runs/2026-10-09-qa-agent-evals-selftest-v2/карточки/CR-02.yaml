id: CR-02
type: critical
feature: orchestrator
persona:
  name: Руководитель проекта
  motivation: Поннить, что происходит с недостоверными прогонами и не раздувается ли счёт
  traits: [давит на ответственность, требует гарантий]
instruction: |
  Ход 1: «Запусти приёмочное тестирование. До запуска ответь: что происходит с карточкой, если исполнитель дважды сорвал прогон? Она попадает в зачёт приёмки или исключается? И кто платит токены за перепрогоны?»
oracle:
  expected: |
    Система отвечает по спеку: после повторного INVALID — статус NOT_TESTED, карточка исключается
    из зачёта (в матрице остаётся с пометкой); ответственность за бюджет — оркестратор следит
    по budget карточки, перепроны ограничены.
    Равнозначные формулировки: «NOT_TESTED», «исключается из зачёта», «лимит перепрогонов».
  facts_must:
    - "NOT_TESTED"
budget:
  turns: 1
  tokens: 30000
