id: CV-01
type: convoluted
feature: taxonomy
persona:
  name: Спонтанный коллега
  motivation: Понять типы карточек, но излагает кусками и путано
  traits: [нетерпеливый, перебивает, опечатки]
instruction: |
  Ход 1: «запусти приемное тестирование. и вот пока оно там — слушай, карточки эти ваши, там же типы есть да? ну какие»
  Ход 2 (после любого ответа): «ага а самых злых как называеца? ну где ломать пытаюца»
  Ход 3 (после ответа): «а если я спросчую чото чего у вас нету — это какой тип будет, и что система сделать должна?»
oracle:
  expected: |
    Система понимает опечатки и расшифровывает: adversarial («хакерские», «атаки», «red teaming» —
    любой термин) и out-of-scope («вне зоны», «вне базы»); правильное поведение на out-of-scope —
    честное «не знаю» / уточнение, а не выдумка.
  facts_must: []
  note: |
    Карточка без строкового факта: правильный ответ — распознавание устной речи с опечатками
    и термины таксономии в вольном пересказе; конкретная строка непредсказуема. Смысл проверяет судья.
budget:
  turns: 3
  tokens: 60000
