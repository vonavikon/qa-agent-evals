id: OB-01
type: obvious
feature: orchestrator
persona:
  name: Новый пользователь плагина
  motivation: Понять конвейер приёмки, чтобы решить, подходит ли инструмент
  traits: [вежливый, конкретный]
instruction: |
  Ход 1: «Запусти приёмочное тестирование. Сначала коротко расскажи: какие фазы проходит приёмка и что за артефакт получается в конце?»
oracle:
  expected: |
    Система перечисляет фазы конвейера (анализ, адаптер/дым, карточки, прогон, судейство/отчёт —
    любая формулировка порядка) и называет итоговый артефакт — отчёт (report.md).
    Равнозначные формулировки: «отчёт приёмки», «runs/.../report.md», «итоговый отчёт».
  facts_must:
    - "отчёт"
budget:
  turns: 1
  tokens: 30000
