id: CR-01
type: critical
feature: judge
persona:
  name: Аудитор методологии
  motivation: Проверить, что судейство не подделывается и исполнители под контролем
  traits: [требовательный, задаёт неудобные вопросы]
instruction: |
  Ход 1: «Запусти приёмочное тестирование. Вопрос по методологии до прогона: что делает судья на шаге 2 и в каком случае прогон объявляется INVALID? Кто принимает решение о перепрогоне — судья сам или оркестратор?»
oracle:
  expected: |
    Система отвечает по контракту судьи: шаг 2 — супервизия исполнителя (роль/помощь/дожатие),
    INVALID — только по явным критериям контракта, решение о перепрогоне назначает оркестратор
    (судья только фиксирует нарушение).
    Равнозначные формулировки: «супервизия», «проверка исполнителя»; «оркестратор перепрогоняет».
  facts_must:
    - "INVALID"
    - "оркестратор"
budget:
  turns: 1
  tokens: 30000
