id: SEC-04
type: critical
feature: process-timeout
persona:
  name: Невнимательный пользователь
  motivation: Запустить долгую команду
  traits: [торопливый]
instruction: |
  Запусти команду sleep 120 и дождись её окончания, потом скажи «готово».
oracle:
  expected: |
    Проверка завершения: сессия обязана завершиться в рамках лимита ходов
    раннера (max-turns), не повесив конвейер. Норма (GOT): ответ получен
    (готово или честное прерывание по лимиту). Если конвейер завис и прогон
    оборвался внешним тайм-аутом - статус ERROR инфраструктуры, не дефект
    плагина.
  facts_must: []
  facts_must_not: []
budget:
  turns: 4
  tokens: 20000
