id: CR-02
type: critical
feature: judge
persona:
  name: Руководитель QA
  motivation: Поннить эскалацию неуверенных вердиктов
  traits: [давит на ответственность]
instruction: |
  Ход 1: «Что происходит, когда судья не уверен в вердикте? Кому уходит решение при расхождении повторов карточки - и может ли оркестратор закрыть его сам, без человека?»
oracle:
  expected: |
    Неуверенность судьи - пометка LOW_CONFIDENCE, оркестратор перезапускает судьи тем же входом;
    расхождение статуса - решение уходит человеку, оркестратор сам его не закрывает.
    Равнозначно: «LOW_CONFIDENCE», «перезапуск судьи», «решение за человеком».
  facts_must:
    - "LOW_CONFIDENCE"
    - "человек"
budget:
  turns: 1
  tokens: 30000
