id: CV-01
type: convoluted
feature: taxonomy
persona:
  name: Спонтанный коллега
  motivation: Понять типы карточек, излагает кусками
  traits: [нетерпеливый, опечатки, перебивает]
instruction: |
  Ход 1: «слушай, карточки эти ваши - там же типы есть да? ну какие»
  Ход 2 (после любого ответа): «ага. а самую вредоносную как называеца? ну где ломать пытаюца»
  Ход 3 (после ответа): «а ессли я спрошю чото чего у вас нет - это какой тип и что система доджна сделать?»
oracle:
  expected: |
    Понимание опечаток и вольной речи: adversarial («атаки», «red teaming», «ломать» - любой
    термин семантически) и out-of-scope с правильным поведением на нём - честное «не знаю» /
    уточнение, не выдумка. Равнозначные формулировки на усмотрение судьи по смыслу.
  facts_must: []
  note: |
    Карточка без строкового факта (правило таксономии): правильный ответ - распознавание
    устной речи и термины в вольном пересказе. Судья проверяет три смысловых пункта:
    распознан adversarial, назван out-of-scope, названо честное поведение на нём.
budget:
  turns: 3
  tokens: 60000
