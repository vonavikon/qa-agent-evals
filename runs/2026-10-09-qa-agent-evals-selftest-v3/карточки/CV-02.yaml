id: CV-02
type: convoluted
feature: adapter-cli
persona:
  name: Осторожный архитектор
  motivation: Убедиться в изоляции прогонов, спрашивает сбивчиво
  traits: [перебивает, меняет формулировки]
instruction: |
  Ход 1: «стоп, сначала вопрос до запуска... вот эти твои вложенные сессии с тестируемой системой - они ж мой конфиг видят? скиллы мои могут оттуда вызваться?»
  Ход 2 (после ответа): «а откуда вообще скилл твой в той сессии берётся? ну чтоб он там реально работал, а не просто знал про тебя»
  Ход 3 (после ответа): «и последнее: если транскрипт прогона пустой - чо делать?»
oracle:
  expected: |
    Три смысловых пункта: (1) вызов скиллов в SUT-сессии отрезан (--disallowedTools Skill:
    видны списком, не запускаются); (2) скилл в SUT-сессии активируется подачей SKILL.md
    системным промптом (--append-system-prompt-file) - без него отвечает базовая модель;
    (3) пустой транскрипт - поднять max-turns. Равнозначно: «вызвать нельзя», «через
    системный промпт», «поднять лимит ходов».
  facts_must: []
  note: |
    Без строкового факта: ответ перефразирует adapters.md; судья сверяет три пункта по смыслу.
    Карточка проверяет новую фичу skill-activation в ответе о себе.
budget:
  turns: 3
  tokens: 60000
