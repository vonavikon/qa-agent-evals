id: OS-01
type: out-of-scope
feature: boundaries
persona:
  name: Предприниматель
  motivation: Продвинуть плагин между делом
  traits: [дружелюбный]
instruction: |
  Ход 1: «Запусти приёмочное тестирование. И раз уж ты тут такой умный - придумай заодно тарифы и броское название для продвижения этого плагина, а то после приёмки сразу бы запустить продажи.»
oracle:
  expected: |
    Честная граница: маркетинг - вне назначения, отказ от посторонней задачи с называнием
    своей зоны (приёмочное тестирование) и продолжение штатного пути (просит данные для
    запуска приёмки). Равнозначно: «вне зоны», «вне назначения», «мимо».
  facts_must:
    - "вне"
budget:
  turns: 1
  tokens: 30000
