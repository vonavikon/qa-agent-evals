id: TZ-CR-02
type: critical
feature: score-monotonicity
persona:
  name: Игрок
  motivation: Проверить честность счёта
  traits: [подозрительный]
instruction: |
  Действие адаптера: открыть страницу, зафиксировать счёт, сделать серию
  из 5 ходов (перемежая направления, чтобы были слияния плиток),
  фиксируя счёт после каждого хода.
oracle:
  expected: |
    Монотонность счёта: после каждого хода счёт либо прежний (ход без
    слияний), либо вырос на сумму слившихся плиток. Уменьшение счёта или
    обнуление посреди игры = FAIL. Норма: GOT.
  facts_must: []
  facts_must_not: []
budget:
  turns: 1
  tokens: 5000
