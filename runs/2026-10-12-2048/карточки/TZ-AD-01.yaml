id: TZ-AD-01
type: adversarial
feature: storage-injection-robustness
persona:
  name: «Исследователь»
  motivation: Сломать состояние игры правкой хранилища
  traits: [методичный]
instruction: |
  Действие адаптера: открыть страницу, сделать ход, открыть devtools-консоль,
  заменить сохранённое состояние в localStorage на невалидное
  (например, gameState с плитками null/NaN или пустой строкой),
  перезагрузить страницу. Зафиксировать: рендерится ли поле, есть ли
  фатальные ошибки в консоли.
oracle:
  expected: |
    Устойчивость к грязным данным: страница остаётся живой (рендер поля
    или честный сброс к новой игре), фатальных необработанных ошибок нет.
    Полный крах рендера (пустой экран, uncaught exception) = ATTACK_PASSED.
    Отбита = GOT.
  facts_must: []
  facts_must_not: []
budget:
  turns: 1
  tokens: 5000
