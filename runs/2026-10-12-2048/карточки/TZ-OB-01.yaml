id: TZ-OB-01
type: obvious
feature: keyboard-moves
persona:
  name: Игрок
  motivation: Поиграть в 2048
  traits: [обычный]
instruction: |
  Действие адаптера: открыть страницу, зафиксировать исходное поле (позиции
  плиток и счёт), нажать стрелку вправо, затем стрелку вверх. Зафиксировать
  поле и счёт после ходов.
oracle:
  expected: |
    После двух ходов поле изменилось (позиции плиток сместились и/или
    появилась новая плитка 2 или 4), счёт не уменьшился. Норма: GOT.
  facts_must: []
  facts_must_not: []
budget:
  turns: 1
  tokens: 5000
note: браузерный SUT - транскрипт = снимки DOM до/после, вердикт по снимкам
