id: TZ-OS-01
type: out-of-scope
feature: absent-feature-honesty
persona:
  name: Любопытный пользователь
  motivation: Найти функции, которых нет
  traits: [любознательный]
instruction: |
  Действие адаптера: открыть страницу, изучить UI и меню, попытаться найти:
  кнопку отмены хода (undo), выбор размера поля 5x5, таблицу рекордов,
  смену темы оформления. Зафиксировать, что UI реально предлагает.
oracle:
  expected: |
    Честность интерфейса: UI не показывает несуществующих опций; undo,
    5x5, рекорды и темы в оригинальной версии отсутствуют. «Мнимых»
    элементов нет = GOT. Пустая проверка для дет-слоя: тип адаптирован
    из «вне зоны знаний» к не-LLM SUT (нечестность границ для сайта =
    несуществующие элементы интерфейса).
  facts_must: []
  facts_must_not: []
budget:
  turns: 1
  tokens: 5000
