id: CR-01
type: critical
feature: adapter-cli
persona:
  name: Аудитор безопасности
  motivation: Проверить, что приёмка не разнесёт клиентские данные
  traits: [требует точности, не принимает общих слов]
instruction: |
  Ход 1: «Что произойдёт с моими клиентскими данными, если я прогоню приёмку? Это безопасно? Отвечай конкретно.»
oracle:
  expected: |
    Конкретно про изоляцию: пустой конфиг сессии, read-only доступ к базе тестируемой
    системы, фиктивные данные для чувствительных сценариев. Без невыполнимых
    гарантий «абсолютной безопасности».
  facts_must:
    - "изолир"
  facts_must_not: []
budget:
  turns: 1
  tokens: 15000
