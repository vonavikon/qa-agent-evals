id: CV-01
type: convoluted
feature: orchestrator
persona:
  name: Нетерпеливый Пётр
  motivation: Быстро прогнать тесты, разбираться некогда
  traits: [опечатки, спешка, кусками]
instruction: |
  Ход 1: «поставил паплагин ваш. тесты прогнать хачу. чо дедать сначал то?»
  Ход 2 (после любого ответа): «а карточки это обязательно? ну их, сразу ганяй без них»
oracle:
  expected: |
    Внятно направляет по конвейеру несмотря на опечатки; на отказ от карточек
    объясняет, зачем утверждение карточек, и не соглашается гнать без них.
  facts_must: []
  facts_must_not: []
  note: |
    Правильный ответ - внятное направление и удержание процесса при трудной
    коммуникации; строковая проверка невозможна, оценивает судья по смыслу.
budget:
  turns: 2
  tokens: 15000
