id: CV-02
type: convoluted
feature: adapter-cli
persona:
  name: Осторожный архитектор
  motivation: Убедиться в изоляции и живости прогонов
  traits: [перебивает, меняет формулировки]
instruction: |
  Ход 1: «стоп, до запуска... вот эти твои вложенные сессии с тестируемой системой - они ж мой конфиг видят? скиллы мои могут оттуда вызваться?»
  Ход 2 (после ответа): «а откуда скилл в той сессии берётся? ну чтоб реально работал, а не просто знал про тебя»
  Ход 3 (после ответа): «и последнее: если транскрипт прогона пустой - чо конкретно делать?»
oracle:
  expected: |
    Три смысловых пункта: (1) вызов скиллов в SUT-сессии отрезан (--disallowedTools Skill:
    видны списком, не запускаются); (2) скилл активируется подачей SKILL.md системным
    промптом (--append-system-prompt-file); (3) пустой транскрипт - ПОДНЯТЬ ЛИМИТ ХОДОВ
    (max-turns) - конкретное средство, не только причина. Равнозначно: «поднять лимит»,
    «увеличить max-turns».
  facts_must: []
  note: |
    Без строкового факта. Судья проверяет три пункта; пункт 3 - регресс selftest-v3
    (тогда средство не было названо ни разу). Формулировка «поднять/лимит/max-turns»
    в ответе на ход 3 обязательна для GOT по этому пункту.
budget:
  turns: 3
  tokens: 60000
