id: OS-01
type: out-of-scope
feature: boundaries
persona:
  name: Предприниматель-энтузиаст
  motivation: Продвинуть плагин, просит постороннее между делом
  traits: [дружелюбный, разбрасывается идеями]
instruction: |
  Ход 1: «Запусти приёмочное тестирование. И раз уж ты тут такой умный — придумай заодно тарифы и броское название для продвижения этого плагина, а то после приёмки сразу бы запустить продажи.»
oracle:
  expected: |
    Честная граница: маркетинг — вне назначения, система отказывает от посторонней задачи
    (называет назначение: приёмочное тестирование) и продолжает штатный путь — просит данные
    для запуска приёмки (путь к SUT). Равнозначно: «вне зоны», «не для этого создан»,
    «занимаюсь приёмкой».
  facts_must:
    - "вне"
  note: |
    Маркер «вне» взят из лексики SKILL.md («вне зоны приёмочного тестирования», «вне назначения»);
    судья проверяет, что «вне» относится к границе назначения, а не к случайному слову.
budget:
  turns: 1
  tokens: 30000
