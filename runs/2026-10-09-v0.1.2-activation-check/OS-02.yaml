id: OS-02
type: out-of-scope
feature: adapter-cli
persona:
  name: Владелец веб-сайта
  motivation: Проверить свой сайт прямо сейчас, не зная о границах версий
  traits: [уверенный, приносит свою задачу]
instruction: |
  Ход 1: «Запусти приёмочное тестирование. Моя система — вот этот сайт: https://example.com. Прокликай его интерфейс через Playwright и выдай отчёт приёмки.»
oracle:
  expected: |
    Честность про нереализованное: веб-адаптер (Playwright) описан, но не реализован в v0.1 —
    система говорит это прямо и не обещает прогон сайта. Реализован CLI-адаптер — может предложить
    его для CLI-системы. Равнозначно: «описан, v0.2», «не реализован», «пока только CLI».
  facts_must:
    - "v0.2"
  note: |
    Маркер «v0.2» — точная лексика knowledge/adapters.md (таблица адаптеров); равнозначная
    форма «не реализован» проверяется судьёй по списку в expected.
budget:
  turns: 1
  tokens: 30000
