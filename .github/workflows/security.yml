name: security

# Sandbox security suite (hardening spec, task 8): image build,
# unit tests, SEC-01..06. No LLM keys: probes are deterministic,
# the CI proxy starts with a placeholder key (no LLM calls are made).
# FAIL or ERROR in any check fails the pipeline; ERROR does not
# count as a pass.

on:
  push:
    paths: ["scripts/sandbox*", "scripts/sec-checks.py", "scripts/sec-integration.py", "scripts/Dockerfile.sandbox", "tests/**", ".github/workflows/security.yml"]
  pull_request:
    paths: ["scripts/sandbox*", "scripts/sec-checks.py", "scripts/sec-integration.py", "scripts/Dockerfile.sandbox", "tests/**", ".github/workflows/security.yml"]
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pipeline unit tests (incl. the fail-closed permissions-probe matrix)
        run: python -m unittest tests.test_scripts -v
      - name: "Live LLM proxy tests (dummy key: methods/paths/normalization/limits/secret)"
        run: python -m unittest tests.test_proxy_live -v
      - name: Build the sandbox image
        run: docker build -t qa-evals-sandbox:latest -f scripts/Dockerfile.sandbox scripts/
      - name: Verify sandbox configuration (fail-closed)
        run: python scripts/sandbox.py verify docker
      - name: Security suite SEC-01..06 + SEC-06A/B + CLEANUP
        run: python scripts/sec-checks.py docker --out runs/sec-ci
      - name: Integration test (no LLM key, expect SKIP; SKIP != PASS)
        run: |
          python scripts/sec-integration.py --out runs/secint-ci || [ "$(python -c "import json;print(json.load(open('runs/secint-ci/secint-report.json'))['status'])")" = "SKIP" ]
      - name: Report and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-report
          path: |
            runs/sec-ci/sec-report.json
            runs/sec-ci/sec-report.md
            runs/sec-ci/*.log
            runs/secint-ci/*
